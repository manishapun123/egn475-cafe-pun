
{% extends "base.html" %}

{% block title %}{{ item.name }} - Café Calle Ocho{% endblock %}

{% block content %}

<h1>{{ item.name }}</h1>

<p><strong>Category:</strong> {{ item.category }}</p>

<p><strong>Price:</strong> ${{ "%.2f"|format(item.price_cents / 100) }}</p>

<p>{{ item.description }}</p>

<a href="{{ url_for('menu') }}" role="button">
    Back to Menu
</a>

{% endblock %}
